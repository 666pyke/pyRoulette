settings:
  # Default radius used by /pyroulette create.
  default-radius: 5.0
  min-radius: 2.0
  max-radius: 20.0

  # Global bet limits.
  min-bet: 100.0
  max-bet: 100000.0

  # Set to 0 for unlimited bets per player in one round.
  max-player-bets-per-round: 1

  # The wheel starts this many seconds after the first bet.
  start-delay-seconds: 10

  idle-animation:
    enabled: true
    speed-degrees-per-tick: 0.35
    # Click hitboxes are synced less often during idle to keep the wheel light.
    interaction-update-interval-ticks: 5

  # Set to 0 to animate whenever the chunk is loaded.
  animation-view-range: 48.0

  spin-duration-seconds: 8
  spin-full-rotations: 5
  result-freeze-seconds: 4

  entity-y-offset: 1.15
  text-y-offset: 1.85
  interaction-width: 1.15
  interaction-height: 1.4

economy:
  provider: VAULT


audit-log:
  enabled: true
  file: "roulette-audit.log"

payouts:
  # Winning payout is bet * multiplier.
  number: 35.0
  red: 1.95
  black: 1.95
  green: 17.5
  column: 3.0

textures:
  # Leave empty to use fallback materials instead of custom heads.
  red: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzNhMDNjMDZmZmUyMzU2Y2UwMGFlZjViNzA4ODc4ZDJmZTQzNjVhOTdiYzRkYWUxZTE1NDJjMjdiMmViMzBkZCJ9fX0="
  black: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvOTQ3MTlmMjFjNWRmYzFjZDgyYWExM2M4N2NjZjhkNDY1MmVjOWUzMjliYjY5ZjM0MDllYmE2NTExYzlkZmMwMyJ9fX0="
  green: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzI0NTAzNjc4MmM2YTdlMjVmZjg0YzUwODdhNjU5NjZkNjUwYzAzM2JhMzdlMDA5NjVlOGI5OTAyMWIzZWNhZSJ9fX0="
  fallback-material:
    red: RED_CONCRETE
    black: BLACK_CONCRETE
    green: LIME_CONCRETE

display:
  interpolation-delay: 0
  interpolation-duration: 2
  teleport-duration: 1

  pocket-scale: 0.45
  head-scale: 0.9
  pocket-rotation-mode: NONE
  pocket-fixed-yaw: 0.0
  pocket-fixed-pitch: 0.0
  winner-scale: 0.75

  pointer-scale: 1.75
  pointer-material: SPECTRAL_ARROW
  pointer-transform: GROUND
  pointer-radius-offset: 0.35
  pointer-y-offset: 1.75
  pointer-location-yaw: 180.0
  pointer-location-pitch: 180.0
  pointer-rotation:
    x: 90.0
    y: 0.0
    z: -90.0

  number-shadow: true
  number-see-through: false
  number-background-argb: 0
  number-y-offset: 1.3
  number-radius-offset: 0.0
  number-billboard: VERTICAL
  number-text: "&f{number}"
  winning-text: "&#ff8fd2Winner: &f{result}"

  winner-particles:
    enabled: true
    type: HAPPY_VILLAGER
    count: 8
    spread: 0.25
    y-offset: 0.35
    interval-ticks: 5

sounds:
  # Sounds are local to players near the roulette.
  spin:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    category: PLAYERS
    volume: 0.45
    pitch: 1.35
    range: 24.0
    interval-ticks: 6
  result:
    enabled: true
    sound: ENTITY_PLAYER_LEVELUP
    category: PLAYERS
    volume: 0.8
    pitch: 1.25
    range: 24.0

hologram:
  enabled: true
  y-offset: 2.6
  billboard: VERTICAL
  location-yaw: 0.0
  location-pitch: 0.0
  shadow: true
  see-through: false
  background-argb: 0
  states:
    waiting: "Waiting"
    spinning: "Spinning"
  # Placeholders: {total_bets}, {amount}, {total_bet_amount}, {time_until_spin}
  lines:
    - "&#ff5ebc&lpyRoulette"
    - "&fBets: &#ff8fd2{total_bets}"
    - "&fAmount: &#ff8fd2{amount}"
    - "&fSpin: &#ff8fd2{time_until_spin}"

