messages:
  prefix: "&#ff5ebc&lROULETTE &8» &f"
  broadcast:
    range: 24.0

  no-permission: "You do not have permission to do that. &#ff8fd2<3"
  only-player: "Only players can use that command."
  economy-unavailable: "Economy is not available right now."
  command-error: "Could not run that command: &#ff8fd2{error}"
  created: "Created roulette &#ff8fd2{id} &fwith radius &#ff8fd2{radius}&f."
  invalid-radius: "Invalid radius &#ff8fd2{input}&f. Use a normal positive number."
  removed: "Removed roulette &#ff8fd2{id}&f."
  not-found: "Roulette not found."
  reloaded: "Configuration reloaded. &#ff8fd2<3"
  list-empty: "No roulettes are saved."
  list-header: "&#ff5ebc&lSaved Roulettes"
  list-entry: "&8- &#ff8fd2{id} &8(&f{world}&8, &f{x}&8, &f{y}&8, &f{z}&8, &fr={radius}&8)"

  bet-placed: "Bet placed: &#ff8fd2{amount} &fon &#ff8fd2{bet}&f."
  enter-bet-amount: "Type the amount for &#ff8fd2{bet} &fin chat within &#ff8fd2{seconds}s&f. Try &#ff8fd21000&f, &#ff8fd21k&f, or &#ff8fd21.5m&f. Type &#ff8fd2cancel &fto cancel."
  invalid-amount-format: "Invalid amount &#ff8fd2{input}&f. Use numbers like &#ff8fd21000&f, &#ff8fd21k&f, or &#ff8fd21.5m&f."
  bet-cancelled: "Roulette bet cancelled."
  bet-input-expired: "Bet input expired."
  bet-limit: "You reached the maximum number of bets for this round."
  invalid-bet: "Bet must be between &#ff8fd2{min_bet} &fand &#ff8fd2{max_bet}&f."
  not-enough-money: "You do not have enough money."

  round-starting: "Roulette spins in &#ff8fd2{seconds}s&f."
  round-spinning: "Roulette is spinning..."
  round-result: "Roulette landed on &#ff8fd2{result}&f."
  bet-won: "You won &#ff8fd2{amount} &ffrom roulette."
  bet-lost: "You lost your bet on &#ff8fd2{bet}&f."
  bet-refunded: "Your bet of &#ff8fd2{amount} &fwas refunded. Reason: &#ff8fd2{reason}&f."
  payout-failed: "Your payout of &#ff8fd2{amount} &fcould not be deposited. Contact an administrator."
  refund-failed: "Your refund of &#ff8fd2{amount} &fcould not be deposited. Contact an administrator."

  usage:
    - ""
    - "&#ff5ebc&lpyRoulette &8» &fCasino roulette for your server"
    - ""
    - "&8- &#ff8fd2/pyroulette create [radius] &8- &fCreate a roulette"
    - "&8- &#ff8fd2/pyroulette remove <id> &8- &fRemove a roulette"
    - "&8- &#ff8fd2/pyroulette list &8- &fList saved roulettes"
    - "&8- &#ff8fd2/pyroulette reload &8- &fReload configuration"


bstats:
  enabled: true